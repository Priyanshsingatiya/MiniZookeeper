<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Events - Mini ZooKeeper</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="container" style="max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem;">
    <!-- Hero Banner -->
    <div style="background: linear-gradient(135deg, #151726 0%, #1a1d30 100%); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.25rem 2rem; margin-bottom: 2rem; box-shadow: var(--shadow-md);">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 style="font-size: 1.85rem; font-weight: 800; color: #fff; margin-bottom: 0.4rem;">
            🎟️ Live Events & Pass Reservations
          </h1>
          <p style="font-size: 0.95rem; color: var(--text-muted); max-width: 650px;">
            Reserve seats with kernel-level distributed lock protection. Guaranteed zero double-booking under high-concurrency traffic.
          </p>
        </div>
        <div id="organizerQuickAction" style="display: none;">
          <a href="organizer.html" class="btn btn-primary">
            + Create New Event
          </a>
        </div>
      </div>
    </div>

    <!-- Filter & Search Bar -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <input type="text" id="searchInput" placeholder="Search events by title or venue..." onkeyup="filterEvents()" class="form-control" style="width: 320px;">
        <span id="eventsCountBadge" class="badge badge-purple" style="padding: 0.4rem 0.8rem;">
          Loading events...
        </span>
      </div>
      <div>
        <button onclick="fetchEvents()" class="btn btn-sm btn-secondary">
          🔄 Refresh Catalog
        </button>
      </div>
    </div>

    <!-- Events Grid Container -->
    <div id="eventsGrid" class="events-grid">
      <div class="state-box" style="grid-column: 1 / -1;">
        <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">⏳</div>
        <div>Loading live events...</div>
      </div>
    </div>
  </div>

  <script src="js/booking-common.js"></script>
  <script>
    renderNavbar("events");

    let allEvents = [];

    const user = getUser();
    if (user && user.role === "ORGANIZER") {
      document.getElementById("organizerQuickAction").style.display = "block";
    }

    async function fetchEvents() {
      try {
        const res = await fetch("/api/events?status=PUBLISHED");
        if (!res.ok) throw new Error("Failed to load events");
        allEvents = await res.json();

        if (allEvents.length === 0) {
          const seedRes = await fetch("/api/events/seed", { method: "POST" });
          const seedData = await seedRes.json();
          allEvents = seedData.events || [];
        }

        renderEvents(allEvents);
      } catch (err) {
        document.getElementById("eventsGrid").innerHTML = `
          <div class="state-box" style="grid-column: 1 / -1; color: #ef4444;">
            <p>Error loading events: ${err.message}</p>
            <button onclick="fetchEvents()" class="btn btn-primary" style="margin-top: 1rem;">Retry</button>
          </div>
        `;
      }
    }

    function renderEvents(events) {
      const grid = document.getElementById("eventsGrid");
      document.getElementById("eventsCountBadge").innerText = `${events.length} Events Available`;

      if (events.length === 0) {
        grid.innerHTML = `
          <div class="state-box" style="grid-column: 1 / -1;">
            <p>No published events found at this time.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = events.map(e => {
        const posterUrl = e.poster || "https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=800&auto=format&fit=crop&q=80";
        const availableSeats = e.available_seats !== undefined ? e.available_seats : e.total_seats;
        const isSoldOut = availableSeats <= 0;

        return `
          <div class="event-card">
            <img src="${posterUrl}" alt="${escapeHtml(e.title)}" class="event-poster" onerror="this.src='https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?w=800'">
            <div class="event-card-body">
              <div class="event-meta">
                <span>📅 ${formatDate(e.event_date)}</span>
              </div>
              <h3 class="event-title">${escapeHtml(e.title)}</h3>
              <div class="event-meta" style="margin-bottom: 0.75rem;">
                <span>📍 ${escapeHtml(e.venue)}</span>
              </div>
              <p class="event-desc">${escapeHtml(e.description || "Join us for this exciting live event experience.")}</p>

              <div style="margin-bottom: 1rem;">
                <span class="badge ${isSoldOut ? 'badge-red' : 'badge-green'}">
                  ${isSoldOut ? 'Sold Out' : `${availableSeats} Seats Available`}
                </span>
                <span style="font-size: 0.8rem; color: var(--text-muted); margin-left: 0.5rem;">
                  (Total: ${e.total_seats})
                </span>
              </div>

              <div class="event-footer">
                <div>
                  <div style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Ticket Price</div>
                  <div class="event-price">$${parseFloat(e.ticket_price).toFixed(2)}</div>
                </div>
                <a href="event-details.html?id=${e.id}" class="btn btn-sm ${isSoldOut ? 'btn-secondary' : 'btn-primary'}">
                  ${isSoldOut ? 'View Layout' : 'Book Seats →'}
                </a>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function filterEvents() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allEvents.filter(e =>
        e.title.toLowerCase().includes(q) ||
        (e.venue && e.venue.toLowerCase().includes(q))
      );
      renderEvents(filtered);
    }

    fetchEvents();
  </script>
</body>
</html>
