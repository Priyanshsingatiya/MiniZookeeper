<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Seat Booking - Mini ZooKeeper</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/booking-common.js"></script>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <!-- Fullscreen Edge-to-Edge Container -->
  <div class="events-page-fullscreen">
    <!-- Two-Column Master-Detail Split Layout -->
    <div class="events-split-layout">
      
      <!-- ===================================================================
           LEFT COLUMN: Vertical Event Timeline & Selection Feed
           =================================================================== -->
      <div class="timeline-column">
        <!-- Vertical timeline track line -->
        <div class="timeline-track-line"></div>

        <!-- Dynamic Event Timeline Feed -->
        <div id="eventsTimelineFeed">
          <div class="state-box" style="padding: 3rem 1.5rem; font-size: 1.1rem;">
            <div style="font-size: 2rem; margin-bottom: 0.75rem;">⏳</div>
            <div>Loading live events...</div>
          </div>
        </div>
      </div>

      <!-- ===================================================================
           RIGHT COLUMN: Grand Auditorium Amphitheater Seating Arena
           =================================================================== -->
      <div class="seating-arena-panel">
        <!-- Header: Title, Legend, and Lock Engine Status -->
        <div class="seating-arena-header">
          <div class="seating-arena-title-group">
            <h1 class="seating-arena-title">Interactive Seat Booking</h1>
            <div class="seating-legend-inline">
              <div class="legend-dot-item">
                <span class="legend-circle open"></span>
                <span>Open (Green)</span>
              </div>
              <div class="legend-dot-item">
                <span class="legend-circle locked"></span>
                <span>Locked/In-Progress (Amber)</span>
              </div>
              <div class="legend-dot-item">
                <span class="legend-circle booked"></span>
                <span>Booked (Crimson)</span>
              </div>
            </div>
          </div>

          <div>
            <div class="lock-status-badge">
              <span class="lock-pulse-dot"></span>
              <span>Lock Engine Connected</span>
            </div>
          </div>
        </div>

        <!-- Grand Amphitheater Bowl: Balcony Wings, Stage, & Curved Seating Rows -->
        <div class="amphitheater-bowl">
          <!-- Outer Architectural Tiered Curved Balcony Wings -->
          <svg class="amphi-wings-svg" viewBox="0 0 1100 580">
            <!-- Left curved balcony tiers -->
            <path class="amphi-wing-path" d="M 170 110 C 80 180, 70 340, 150 490" />
            <path class="amphi-wing-path" d="M 140 130 C 50 200, 40 360, 120 505" />
            <path class="amphi-wing-path" d="M 200 95 C 110 165, 100 320, 180 475" />
            <!-- Left architectural box dividers -->
            <line x1="105" y1="185" x2="165" y2="160" class="amphi-wing-path" />
            <line x1="65" y1="285" x2="130" y2="270" class="amphi-wing-path" />
            <line x1="75" y1="390" x2="140" y2="375" class="amphi-wing-path" />

            <!-- Right curved balcony tiers -->
            <path class="amphi-wing-path" d="M 930 110 C 1020 180, 1030 340, 950 490" />
            <path class="amphi-wing-path" d="M 960 130 C 1050 200, 1060 360, 980 505" />
            <path class="amphi-wing-path" d="M 900 95 C 990 165, 1000 320, 920 475" />
            <!-- Right architectural box dividers -->
            <line x1="995" y1="185" x2="935" y2="160" class="amphi-wing-path" />
            <line x1="1035" y1="285" x2="970" y2="270" class="amphi-wing-path" />
            <line x1="1025" y1="390" x2="960" y2="375" class="amphi-wing-path" />
          </svg>

          <!-- Stage Element -->
          <div class="arena-stage-box">
            STAGE
          </div>

          <!-- Central Grand Auditorium Seating Layout (10 Curved Rows) -->
          <div id="arenaSeatingGrid" class="arena-seating-container">
            <div class="state-box" style="padding: 3rem; font-size: 1.15rem;">Loading auditorium seat layout...</div>
          </div>
        </div>

        <!-- Floating Bottom-Right Booking Summary Card -->
        <div id="floatingBookingCard" class="floating-booking-card" style="display: none;">
          <img id="floatingThumb" src="" alt="Event Poster" class="floating-event-thumb" onerror="this.src='https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=800'">
          <div class="floating-event-info">
            <div id="floatingTitle" class="floating-event-title">Google Developer Conference 2026</div>
            <div id="floatingVenue" class="floating-event-venue">Moscone Center West, San Francisco</div>
          </div>
          <div class="floating-booking-actions">
            <div id="floatingPrice" class="floating-price">$299.00</div>
            <button id="floatingBookBtn" onclick="handleBookSelectedSeats()" class="floating-book-btn">
              Book Selected Seats ➔
            </button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    renderNavbar("events");

    let allEvents = [];
    let activeEvent = null;
    let eventSeats = [];
    let selectedSeatIds = new Set();
    let seatObjectMap = new Map();

    const MONTH_NAMES = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

    async function loadEventsData() {
      try {
        const res = await fetch("/api/events?status=PUBLISHED");
        if (!res.ok) throw new Error("Failed to load events");
        allEvents = await res.json();

        if (allEvents.length === 0) {
          const seedRes = await fetch("/api/events/seed", { method: "POST" });
          const seedData = await seedRes.json();
          allEvents = seedData.events || [];
        }

        renderTimeline(allEvents);

        // Check if query parameter specifies an event ID, or default to first event
        const urlParams = new URLSearchParams(window.location.search);
        const reqId = parseInt(urlParams.get("id"), 10);
        const initialEvent = allEvents.find(e => e.id === reqId) || allEvents[0];

        if (initialEvent) {
          selectEvent(initialEvent.id);
        }
      } catch (err) {
        document.getElementById("eventsTimelineFeed").innerHTML = `
          <div class="state-box" style="color: #ef4444; font-size: 1.1rem;">
            <p>Error loading events: ${escapeHtml(err.message)}</p>
            <button onclick="loadEventsData()" class="btn btn-primary" style="margin-top: 1rem;">Retry</button>
          </div>
        `;
      }
    }

    function renderTimeline(events) {
      const container = document.getElementById("eventsTimelineFeed");
      if (events.length === 0) {
        container.innerHTML = `<div class="state-box"><p>No published events available.</p></div>`;
        return;
      }

      container.innerHTML = events.map((e, idx) => {
        const dateObj = new Date(e.event_date || Date.now());
        const monthStr = isNaN(dateObj.getTime()) ? "DEC" : MONTH_NAMES[dateObj.getMonth()];
        const dayStr = isNaN(dateObj.getTime()) ? (11 + idx * 7) : dateObj.getDate();
        const posterUrl = e.poster || "https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=800&auto=format&fit=crop&q=80";
        const availSeats = e.available_seats !== undefined ? e.available_seats : e.total_seats;

        return `
          <div id="timeline-item-${e.id}" class="timeline-item ${activeEvent && activeEvent.id === e.id ? 'active' : ''}" onclick="selectEvent(${e.id})">
            <div class="timeline-date-badge">
              <span class="month">${monthStr}</span>
              <span class="day">${dayStr}</span>
            </div>
            <div class="timeline-card">
              <div class="timeline-card-header">
                <img src="${posterUrl}" alt="${escapeHtml(e.title)}" class="timeline-card-poster" onerror="this.src='https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=800'">
                <div class="timeline-card-info">
                  <div class="timeline-card-title">${escapeHtml(e.title)}</div>
                  <div class="timeline-card-venue">${escapeHtml(e.venue)}</div>
                </div>
              </div>
              <div class="timeline-card-badges">
                <div class="timeline-avail-label">${availSeats} SEATS AVAILABLE</div>
                <div class="timeline-locks-pill">
                  <span>🔒</span>
                  <span>Active Locks: 2</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function selectEvent(eventId) {
      activeEvent = allEvents.find(e => e.id === eventId);
      if (!activeEvent) return;

      // Update active highlight in timeline
      document.querySelectorAll(".timeline-item").forEach(item => item.classList.remove("active"));
      const activeEl = document.getElementById(`timeline-item-${eventId}`);
      if (activeEl) activeEl.classList.add("active");

      // Reset selected seats for newly activated event
      selectedSeatIds.clear();

      // Update floating booking card
      const floatingCard = document.getElementById("floatingBookingCard");
      floatingCard.style.display = "flex";
      document.getElementById("floatingThumb").src = activeEvent.poster || "https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=800";
      document.getElementById("floatingTitle").innerText = activeEvent.title;
      document.getElementById("floatingVenue").innerText = activeEvent.venue;
      updateFloatingPrice();

      // Fetch and render seats for this event
      await loadSeatsForEvent(activeEvent.id);
    }

    async function loadSeatsForEvent(eventId) {
      const grid = document.getElementById("arenaSeatingGrid");
      grid.innerHTML = `<div class="state-box" style="padding: 3rem; font-size: 1.15rem;">Loading auditorium seat layout...</div>`;

      try {
        const res = await fetch(`/api/events/${eventId}/seats`);
        if (!res.ok) throw new Error("Failed to load seats");
        eventSeats = await res.json();
        renderAuditoriumArena(eventSeats);
      } catch (err) {
        grid.innerHTML = `<div class="state-box" style="color: #ef4444;"><p>Error: ${escapeHtml(err.message)}</p></div>`;
      }
    }

    /**
     * Renders a Grand Auditorium Layout with 10 Curved Amphitheater Rows.
     * Matches the authentic orientation from the user's reference screenshot:
     * - Left Section (Balcony A): 4 seats
     * - Aisle
     * - Center Section (Orchestra): 10 seats
     * - Aisle
     * - Right Section (Balcony B): 4 seats
     * Total = 18 seats per row x 10 rows = 180 auditorium seats.
     * Real database seats are mapped into the prime Center Orchestra section,
     * while surrounding seats represent booked auditorium audience members.
     */
    function renderAuditoriumArena(realSeats) {
      const grid = document.getElementById("arenaSeatingGrid");
      seatObjectMap.clear();

      // Index real database seats
      realSeats.forEach(s => {
        seatObjectMap.set(s.id, s);
      });

      const totalRows = 10;
      const leftSeatsCount = 4;
      const centerSeatsCount = 10;
      const rightSeatsCount = 4;
      const seatsInRow = leftSeatsCount + centerSeatsCount + rightSeatsCount; // 18 seats

      let realSeatIdx = 0;
      let rowsHtml = "";

      // We assign real database seats to prime center rows (Rows 3, 4, 5, etc.)
      const primeStartRow = Math.max(1, Math.floor((totalRows - Math.ceil(realSeats.length / centerSeatsCount)) / 2));

      for (let r = 0; r < totalRows; r++) {
        const rowNumber = r + 1;
        const isPrimeCenterRow = r >= primeStartRow && realSeatIdx < realSeats.length;

        let leftDots = "";
        let centerDots = "";
        let rightDots = "";

        // Helper to compute amphitheater arc curvature (outer seats curve upwards towards stage)
        const getArcTransform = (colIndex) => {
          const dist = Math.abs(colIndex - 8.5); // Center is between 8 and 9
          const offsetY = -Math.round(Math.pow(dist, 1.7) * 0.42);
          return `transform: translateY(${offsetY}px);`;
        };

        // 1. Left Wing Seats (Col 0..3)
        for (let c = 0; c < leftSeatsCount; c++) {
          const globalCol = c;
          const arcStyle = getArcTransform(globalCol);
          // Left wing seats are booked audience seats
          leftDots += `
            <div 
              class="seat-dot booked" 
              style="${arcStyle}" 
              title="Row ${rowNumber}, Seat ${c + 1} (Balcony A) - Booked"
              onclick="showToast('Row ${rowNumber}, Seat ${c + 1} is already booked.', 'warning')">
            </div>
          `;
        }

        // 2. Center Orchestra Seats (Col 4..13)
        for (let c = 0; c < centerSeatsCount; c++) {
          const globalCol = leftSeatsCount + c;
          const arcStyle = getArcTransform(globalCol);

          if (isPrimeCenterRow && realSeatIdx < realSeats.length) {
            // This is a REAL database seat!
            const s = realSeats[realSeatIdx++];
            const isSelected = selectedSeatIds.has(s.id);
            let statusClass = "open";

            if (isSelected) {
              statusClass = "selected";
            } else if (s.status === "SOLD") {
              statusClass = "booked";
            } else if (s.status === "RESERVED") {
              statusClass = "locked";
            }

            const tooltip = `Seat ${s.seat_number} (Row ${rowNumber}) - ${s.status === 'SOLD' ? 'Booked' : s.status === 'RESERVED' ? 'Locked (5-min hold)' : 'Open'}`;

            centerDots += `
              <div 
                id="seat-dot-${s.id}" 
                class="seat-dot ${statusClass}" 
                style="${arcStyle}" 
                title="${tooltip}"
                onclick="toggleSeatSelection(${s.id}, '${s.status}')">
              </div>
            `;
          } else {
            // Filler center seat (booked)
            centerDots += `
              <div 
                class="seat-dot booked" 
                style="${arcStyle}" 
                title="Row ${rowNumber}, Seat ${c + 5} - Booked"
                onclick="showToast('Seat is already booked.', 'warning')">
              </div>
            `;
          }
        }

        // 3. Right Wing Seats (Col 14..17)
        for (let c = 0; c < rightSeatsCount; c++) {
          const globalCol = leftSeatsCount + centerSeatsCount + c;
          const arcStyle = getArcTransform(globalCol);
          // Right wing seats are booked audience seats
          rightDots += `
            <div 
              class="seat-dot booked" 
              style="${arcStyle}" 
              title="Row ${rowNumber}, Seat ${c + 15} (Balcony B) - Booked"
              onclick="showToast('Row ${rowNumber}, Seat ${c + 15} is already booked.', 'warning')">
            </div>
          `;
        }

        rowsHtml += `
          <div class="seat-row">
            <span class="row-num">${rowNumber}</span>
            <div class="row-seats-track">
              <!-- Left Wing Section -->
              ${leftDots}
              <!-- Left Aisle -->
              <div class="auditorium-aisle"></div>
              <!-- Center Orchestra Section -->
              ${centerDots}
              <!-- Right Aisle -->
              <div class="auditorium-aisle"></div>
              <!-- Right Wing Section -->
              ${rightDots}
            </div>
            <span class="row-num">${rowNumber}</span>
          </div>
        `;
      }

      grid.innerHTML = rowsHtml;
    }

    function toggleSeatSelection(seatId, currentStatus) {
      if (currentStatus === "SOLD") {
        showToast("This seat is already booked.", "warning");
        return;
      }
      if (currentStatus === "RESERVED" && !selectedSeatIds.has(seatId)) {
        showToast("Seat is currently locked under reservation.", "warning");
        return;
      }

      if (selectedSeatIds.has(seatId)) {
        selectedSeatIds.delete(seatId);
      } else {
        selectedSeatIds.add(seatId);
      }

      // Re-render dot classes
      eventSeats.forEach(s => {
        const el = document.getElementById(`seat-dot-${s.id}`);
        if (!el) return;
        el.className = "seat-dot";
        if (selectedSeatIds.has(s.id)) {
          el.classList.add("selected");
        } else if (s.status === "SOLD") {
          el.classList.add("booked");
        } else if (s.status === "RESERVED") {
          el.classList.add("locked");
        } else {
          el.classList.add("open");
        }
      });

      updateFloatingPrice();
    }

    /**
     * Silently polls live seat status every 3 seconds.
     * When 5-minute reservations expire, their amber locked dots automatically turn green in real time!
     */
    async function refreshSeatsSilently(eventId) {
      try {
        const res = await fetch(`/api/events/${eventId}/seats`);
        if (!res.ok) return;
        const freshSeats = await res.json();
        eventSeats = freshSeats;

        freshSeats.forEach(s => {
          seatObjectMap.set(s.id, s);
          const el = document.getElementById(`seat-dot-${s.id}`);
          if (!el) return;

          if (selectedSeatIds.has(s.id)) {
            el.className = "seat-dot selected";
          } else if (s.status === "SOLD") {
            el.className = "seat-dot booked";
          } else if (s.status === "RESERVED") {
            el.className = "seat-dot locked";
          } else {
            el.className = "seat-dot open";
          }
          const tooltip = `Seat ${s.seat_number} - ${s.status === 'SOLD' ? 'Booked' : s.status === 'RESERVED' ? 'Locked (5-min hold)' : 'Open'}`;
          el.title = tooltip;
          el.onclick = () => toggleSeatSelection(s.id, s.status);
        });

        // Update available seats counter on active timeline card
        const availCount = freshSeats.filter(s => s.status === "AVAILABLE").length;
        const cardAvailEl = document.querySelector(`#timeline-item-${eventId} .timeline-avail-label`);
        if (cardAvailEl) {
          cardAvailEl.innerText = `${availCount} SEATS AVAILABLE`;
        }
      } catch (e) {
        // Silent fail on background poll
      }
    }

    // Live sync seat status every 3 seconds to keep expired and released seats instantly updated
    setInterval(() => {
      if (activeEvent && !document.hidden) {
        refreshSeatsSilently(activeEvent.id);
      }
    }, 3000);

    function updateFloatingPrice() {
      if (!activeEvent) return;
      const count = selectedSeatIds.size;
      const unitPrice = parseFloat(activeEvent.ticket_price) || 299.00;
      const total = count > 0 ? (unitPrice * count) : unitPrice;

      document.getElementById("floatingPrice").innerText = `$${total.toFixed(2)}`;
      const bookBtn = document.getElementById("floatingBookBtn");
      if (count > 0) {
        bookBtn.innerText = `Book ${count} Selected Seat${count > 1 ? 's' : ''} ➔`;
      } else {
        bookBtn.innerText = `Book Selected Seats ➔`;
      }
    }

    async function handleBookSelectedSeats() {
      const user = getUser();
      if (!user) {
        showToast("Please sign in to proceed with booking.", "warning");
        setTimeout(() => {
          window.location.href = `login.html?redirect=events.html`;
        }, 600);
        return;
      }

      if (!activeEvent) return;

      // If no seats selected yet, auto-select first available green seat for effortless one-click booking
      if (selectedSeatIds.size === 0) {
        const firstAvail = eventSeats.find(s => s.status === "AVAILABLE");
        if (firstAvail) {
          selectedSeatIds.add(firstAvail.id);
          toggleSeatSelection(firstAvail.id, firstAvail.status);
        } else {
          showToast("No available seats left for this event.", "danger");
          return;
        }
      }

      const bookBtn = document.getElementById("floatingBookBtn");
      bookBtn.disabled = true;
      bookBtn.innerText = "Locking with Mini ZooKeeper...";

      try {
        const user = getUser();
        const payload = {
          event_id: activeEvent.id,
          seat_ids: Array.from(selectedSeatIds),
          user_id: user.id
        };

        const res = await authFetch("/api/bookings/reserve", {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          let errMsg = "Lock acquisition failed. Seat is busy.";
          if (data) {
            if (typeof data.detail === "string") {
              errMsg = data.detail;
            } else if (Array.isArray(data.detail) && data.detail.length > 0) {
              errMsg = data.detail.map(d => d.msg || (d.loc ? d.loc.join('.') : '')).join(", ");
            } else if (data.message) {
              errMsg = data.message;
            }
          }
          throw new Error(errMsg);
        }

        const bookingId = data.booking_id || data.id;
        showToast("Seats locked! Proceeding to checkout...", "success");
        setTimeout(() => {
          window.location.href = `checkout.html?booking_id=${bookingId}`;
        }, 600);
      } catch (err) {
        showToast(err.message, "danger");
        bookBtn.disabled = false;
        updateFloatingPrice();
        // Refresh seats in case status changed
        loadSeatsForEvent(activeEvent.id);
      }
    }

    // Initialize on page load
    loadEventsData();
  </script>
</body>
</html>
