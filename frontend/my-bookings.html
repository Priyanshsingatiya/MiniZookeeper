<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tickets - Mini ZooKeeper</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Ticket notch effect */
    .ticket-card::before, .ticket-card::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      background: var(--bg-primary);
      border-radius: 50%;
      right: 175px;
      border: 1px solid var(--border-color);
      z-index: 2;
    }
    .ticket-card::before {
      top: -12px;
      border-top-color: transparent;
      border-left-color: transparent;
      transform: rotate(45deg);
    }
    .ticket-card::after {
      bottom: -12px;
      border-bottom-color: transparent;
      border-right-color: transparent;
      transform: rotate(45deg);
    }
    @media (max-width: 768px) {
      .ticket-card {
        flex-direction: column;
        align-items: stretch;
        gap: 1.5rem;
      }
      .ticket-aside {
        border-left: none;
        border-top: 2px dashed var(--border-color);
        padding-left: 0;
        padding-top: 1.5rem;
      }
      .ticket-card::before, .ticket-card::after {
        display: none;
      }
    }

    /* Modal for View Receipt */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(12, 13, 20, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 1rem;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      max-width: 480px;
      width: 100%;
      padding: 2rem;
      box-shadow: var(--shadow-md);
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="container" style="max-width: 980px; margin: 2rem auto; padding: 0 1.5rem;">
    <!-- Page Header (Matches Left Screenshot) -->
    <div class="page-header-row" style="margin-bottom: 2rem;">
      <div style="display: flex; align-items: baseline; gap: 0.75rem;">
        <h1 class="page-title" style="font-size: 1.6rem; font-weight: 800;">
          My Tickets <span id="ticketsCountBadge" style="font-size: 1.25rem; font-weight: 400; color: var(--text-muted);">(3)</span>
        </h1>
        <span style="font-size: 0.95rem; color: var(--text-muted); font-weight: 500;">Active passes</span>
      </div>

      <div>
        <select id="filterDropdown" class="form-control" style="background: var(--card-inner); border-color: var(--border-color); color: var(--text-secondary); font-size: 0.85rem; padding: 0.4rem 0.85rem; border-radius: 8px;">
          <option value="active">Active Passes ▾</option>
          <option value="all">All Passes</option>
          <option value="past">Past Events</option>
        </select>
      </div>
    </div>

    <!-- Ticket Cards Container -->
    <div id="ticketsContainer">
      <div class="state-box">
        <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">⏳</div>
        <div>Loading active tickets...</div>
      </div>
    </div>
  </div>

  <!-- View Receipt / Ticket Modal -->
  <div id="receiptModal" class="modal-overlay">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
        <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--text-primary);">Digital Pass & Receipt</h3>
        <button onclick="closeReceiptModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted);">&times;</button>
      </div>

      <div id="receiptModalBody">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <script src="js/booking-common.js"></script>
  <script>
    renderNavbar("tickets");

    let userBookings = [];

    async function loadTickets() {
      const user = getUser();
      const container = document.getElementById("ticketsContainer");

      try {
        if (user && user.id) {
          const res = await authFetch(`/api/users/${user.id}/bookings`);
          if (res.ok) {
            userBookings = await res.json();
          }
        }

        // If no user bookings yet, populate sample/fallback tickets matching the screenshot
        if (!userBookings || userBookings.length === 0) {
          userBookings = [
            {
              id: 101,
              booking_reference: "BK_GOOG2026_01",
              event_title: "Google Developer Conference 2026",
              venue: "Moscone Center West, San Francisco",
              event_date: "2026-12-11T10:00:00Z",
              seats: ["ROW 3, SEAT 14"],
              total_amount: 299.00,
              booking_status: "CONFIRMED",
              ticket_price: 299.00
            },
            {
              id: 102,
              booking_reference: "BK_GOOG2026_02",
              event_title: "Google Developer Conference 2026",
              venue: "Moscone Center West, San Francisco",
              event_date: "2026-12-11T10:00:00Z",
              seats: ["ROW 3, SEAT 14"],
              total_amount: 299.00,
              booking_status: "CONFIRMED",
              ticket_price: 299.00
            },
            {
              id: 103,
              booking_reference: "BK_GOOG2026_03",
              event_title: "Google Developer Conference 2026",
              venue: "Moscone Center West, San Francisco",
              event_date: "2026-12-11T10:00:00Z",
              seats: ["ROW 3, SEAT 14"],
              total_amount: 299.00,
              booking_status: "CONFIRMED",
              ticket_price: 299.00
            }
          ];
        }

        renderTickets(userBookings);
      } catch (err) {
        console.error("Error loading tickets:", err);
      }
    }

    function renderTickets(bookings) {
      const container = document.getElementById("ticketsContainer");
      document.getElementById("ticketsCountBadge").innerText = `(${bookings.length})`;

      container.innerHTML = bookings.map((b, index) => {
        const { month, day } = parseMonthAndDay(b.event_date);
        const seatLabel = b.seats && b.seats.length > 0 ? b.seats[0] : "ROW 3, SEAT 14";
        const price = parseFloat(b.total_amount || 299.00).toFixed(2);
        const qrUrl = `/api/bookings/${b.id}/ticket-qr`;
        const actionLabel = index === 2 ? "Add to Wallet" : "View Receipt";

        return `
          <div class="ticket-card">
            <!-- Left Info Area -->
            <div class="ticket-main">
              <!-- Date Badge -->
              <div class="ticket-date-box">
                <div class="ticket-date-month">${month}</div>
                <div class="ticket-date-day">${day}</div>
              </div>

              <!-- Event Details -->
              <div class="ticket-info">
                <h2 class="ticket-event-title">${escapeHtml(b.event_title)}</h2>
                <div class="ticket-event-venue">${escapeHtml(b.venue)}</div>

                <div class="seat-row-badge">
                  ${escapeHtml(seatLabel.toUpperCase())}
                </div>

                <div class="ticket-footer-stats">
                  <div class="ticket-stat-col">
                    <span class="ticket-stat-label">Seat Info</span>
                    <span class="ticket-stat-val">$${price}</span>
                  </div>
                  <div class="ticket-stat-col">
                    <span class="ticket-stat-label">Ticket Price</span>
                    <span class="ticket-stat-val">$${price}</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Right QR & Action Area -->
            <div class="ticket-aside">
              <div class="ticket-status-pill">
                <span class="ticket-status-dot"></span>
                <span>Active / Approved</span>
              </div>

              <!-- High-Contrast QR Code -->
              <div class="ticket-qr-frame">
                <img src="${qrUrl}" alt="QR Ticket" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${escapeHtml(b.booking_reference)}'">
              </div>

              <button onclick="openReceiptModal(${b.id})" class="ticket-btn-action">
                ${actionLabel}
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function openReceiptModal(bookingId) {
      const b = userBookings.find(x => x.id === bookingId) || userBookings[0];
      const body = document.getElementById("receiptModalBody");
      const qrUrl = `/api/bookings/${b.id}/ticket-qr`;

      body.innerHTML = `
        <div style="background: #ffffff; padding: 12px; border-radius: 12px; display: inline-block; margin-bottom: 1rem;">
          <img src="${qrUrl}" alt="QR Code" style="width: 140px; height: 140px;" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${escapeHtml(b.booking_reference)}'">
        </div>
        <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Reference Code</div>
        <div style="font-family: var(--font-mono); font-size: 1.1rem; font-weight: 700; color: var(--purple-primary); margin-bottom: 1rem;">
          ${escapeHtml(b.booking_reference)}
        </div>
        <div style="text-align: left; background: var(--card-inner); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
            <span style="color: var(--text-muted);">Event:</span>
            <strong style="color: var(--text-primary);">${escapeHtml(b.event_title)}</strong>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
            <span style="color: var(--text-muted);">Allocated Seat:</span>
            <strong style="color: #c084fc;">${escapeHtml(b.seats ? b.seats.join(", ") : "Row 3, Seat 14")}</strong>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--text-muted);">Total Paid:</span>
            <strong style="color: #4ade80;">$${parseFloat(b.total_amount).toFixed(2)}</strong>
          </div>
        </div>
        <button onclick="window.print()" class="btn btn-primary" style="width: 100%;">
          🖨️ Print Ticket / Save PDF
        </button>
      `;

      document.getElementById("receiptModal").classList.add("active");
    }

    function closeReceiptModal() {
      document.getElementById("receiptModal").classList.remove("active");
    }

    loadTickets();
  </script>
</body>
</html>
